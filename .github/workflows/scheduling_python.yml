name: Executar Script Python Diário

# Define o gatilho de agendamento (Schedule)
on:
  schedule:
    # 12:00 UTC corresponde às 09:00 no Horário de Brasília (UTC-3)
    # cron: 'min(0-59) hora(0-23) dia/mes(1-31) mes dia/semana(0-6)'
    - cron: '17 17 * * *' # Configurado para 10h17 Horário de Brasilia
  
  # Permite que você force a execução manual pelo painel do GitHub se precisar testar
  workflow_dispatch:

jobs:
  executar_script:
    runs-on: ubuntu-latest

    steps:
    # Baixa o código do seu repositório para a máquina virtual
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # Tenta baixar historico anterior
    - name: Baixar histórico anterior
      uses: actions/download-artifact@v4
      with:
        name: historico-noticias
        path: .
      continue-on-error: true # se for a primeira vez, ignora a inexistencia do arquivo

    # Configura o ambiente com a versão do Python que você deseja
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Você pode alterar para a versão que preferir

    # Instala as dependências (caso seu script precise de bibliotecas externas)
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Executa o seu script Python
    - name: Rodar o script
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY}}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY}}
        URL_GREEN_API: ${{ secrets.URL_GREEN_API}}
        CHAT_ID: ${{ secrets.CHAT_ID}}
        BOT_API_KEY: ${{ secrets.BOT_API_KEY}}
        ZAP_ID: ${{ secrets.ZAP_ID}}
      run: python src/news_automation.py # arquivo .py

    # Salva o historico atualizado de volta na nuvem
    - name: Salvar historico atualizado
      uses: actions/upload-artifact@v4
      with:
        name: historico-noticias
        path: historico_noticias.txt
        retention-days: 14  # mantem o arquivo por 14 dias
        overwrite: true     # substitui o artefato antigo pelo novo