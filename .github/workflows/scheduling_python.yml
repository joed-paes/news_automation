name: Executar Script Python Diário

# Define o gatilho de agendamento (Schedule)
on:
  schedule:
    # 12:00 UTC corresponde às 09:00 no Horário de Brasília (UTC-3)
    - cron: '0 12 * * *'
  
  # Permite que você force a execução manual pelo painel do GitHub se precisar testar
  workflow_dispatch:

jobs:
  executar_script:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do seu repositório para a máquina virtual
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # 2. Configura o ambiente com a versão do Python que você deseja
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Você pode alterar para a versão que preferir

    # 3. Instala as dependências (caso seu script precise de bibliotecas externas)
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Executa o seu script Python
    - name: Rodar o script
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY}}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY}}
        URL_GREEN_API: ${{ secrets.URL_GREEN_API}}
        CHAT_ID: ${{ secrets.CHAT_ID}}
      run: python src/news_automation.py # arquivo .py